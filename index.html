<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chess IR" />
    <meta name="description" content="Chess IR — le championnat d'échecs de la classe. Jouer. Progresser. Grimper." />
    <link rel="preload" href="/icon-512.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Chess IR</title>
    <!-- Écran de lancement : affiché instantanément, avant le chargement de l'application. -->
    <style>
      html, body { margin: 0; background: #05061a; }
      #splash {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(90% 55% at 50% 8%, rgba(98, 76, 230, 0.42), transparent 62%),
          radial-gradient(60% 40% at 50% 62%, rgba(245, 184, 61, 0.12), transparent 70%),
          #05061a;
        color: #eef0ff; font-family: 'Barlow Semi Condensed', 'Inter', system-ui, sans-serif;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      /* Damier en perspective, qui s'estompe vers l'horizon */
      #splash .floor {
        position: absolute; left: 0; right: 0; bottom: 0; height: 40%; overflow: hidden;
        perspective: 260px; perspective-origin: 50% 0%;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 60%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 60%);
      }
      #splash .floor::before {
        content: ''; position: absolute; left: -150%; right: -150%; top: 0; height: 260%;
        transform: rotateX(62deg); transform-origin: 50% 0%;
        background: repeating-conic-gradient(rgba(150, 150, 255, 0.15) 0 25%, rgba(10, 12, 40, 0) 0 50%) 0 0 / 70px 70px;
      }
      #splash .floor::after {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(60% 80% at 50% 0%, rgba(245, 184, 61, 0.16), transparent 70%);
      }
      #splash .glow {
        position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -230px 0 0 -170px;
        border-radius: 50%; background: radial-gradient(circle, rgba(245, 184, 61, 0.22), transparent 65%);
        animation: splash-pulse 2.4s ease-in-out infinite;
      }
      #splash .content { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -8vh; }
      #splash img {
        width: 132px; height: 132px; border-radius: 27%;
        box-shadow: 0 18px 50px -12px rgba(245, 184, 61, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
        animation: splash-rise .7s cubic-bezier(.2, .8, .2, 1) both;
      }
      #splash h1 {
        margin: 26px 0 0; font-size: 46px; font-weight: 700; letter-spacing: .5px; line-height: 1;
        animation: splash-rise .7s .08s cubic-bezier(.2, .8, .2, 1) both;
      }
      #splash h1 span {
        background: linear-gradient(#ffe6a8, #e09a24); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #splash p {
        margin: 12px 0 0; font-family: 'Inter', system-ui, sans-serif; font-size: 16px; letter-spacing: .3px; color: #aab0d8;
        animation: splash-rise .7s .16s cubic-bezier(.2, .8, .2, 1) both;
      }
      #splash .bar {
        position: absolute; bottom: calc(56px + env(safe-area-inset-bottom)); width: 132px; height: 5px;
        border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden;
      }
      #splash .bar::after {
        content: ''; position: absolute; inset: 0; width: 45%; border-radius: inherit;
        background: linear-gradient(90deg, #ffd577, #f5b83d);
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(230%); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes splash-pulse { 50% { opacity: .55; transform: scale(.92); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de Chess IR">
      <div class="floor"></div>
      <div class="glow"></div>
      <div class="content">
        <img src="/icon-512.png" alt="" width="132" height="132" />
        <h1>Chess <span>IR</span></h1>
        <p>Jouer. Progresser. Grimper.</p>
      </div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script>
      // Filet de sécurité : ne jamais bloquer l'écran si l'application tarde.
      setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('hide'); }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
